[package]
autobenches = false
autotests = false
categories = ["api-bindings", "date-and-time", "wasm"]
description = "Drop-in replacement for std::time for Wasm in browsers"
edition = "2024"
include = ["CHANGELOG.md", "LICENSE-*", "src/**/*"]
keywords = ["instant", "systemtime", "time", "wasm", "web"]
license = "MIT OR Apache-2.0"
name = "web-time"
repository = "https://github.com/daxpedda/web-time"
version = "2.0.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg=docsrs"]
targets = ["wasm32-unknown-unknown", "wasm32v1-none"]

[workspace]
exclude = ["tests-crates/minimal-versions", "tests-crates/resolver"]
members = ["tests-native", "tests-web"]
resolver = "3"

[workspace.dependencies]
dlmalloc = { version = "0.2", default-features = false, features = ["global"] }
futures-channel = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false }
getrandom = { version = "0.4", default-features = false }
js-sys = { version = "0.3", default-features = false }
libm = { version = "0.2", default-features = false }
pollster = { version = "0.4", default-features = false }
rand = { version = "0.10", default-features = false }
rustversion = { version = "1.0", default-features = false }
serde = { version = "1.0", default-features = false }
serde-json-core = { version = "0.6", default-features = false }
serde_json = { version = "1.0", default-features = false }
serde_test = { version = "1.0", default-features = false }
static_assertions = { version = "1.1", default-features = false }
tests-web = { path = "tests-web", default-features = false }
wasm-bindgen = { version = "0.2", default-features = false }
wasm-bindgen-futures = { version = "0.4", default-features = false }
wasm-bindgen-test = { version = "0.3", default-features = false }
web-sys = { version = "0.3", default-features = false }
web-thread = { version = "0.2", default-features = false }

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
equatable_if_let = "allow"
explicit_deref_methods = "allow"
future_not_send = "allow"
module_inception = "allow"
module_name_repetitions = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"
tabs_in_doc_comments = "allow"
as_conversions = "warn"
clone_on_ref_ptr = "warn"
fn_to_numeric_cast_any = "warn"
indexing_slicing = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
mixed_read_write_in_expression = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
absolute_paths = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
create_dir = "warn"
dbg_macro = "warn"
decimal_literal_representation = "warn"
default_union_representation = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
error_impl_error = "warn"
exit = "warn"
filetype_is_file = "warn"
float_cmp_const = "warn"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
impl_trait_in_params = "warn"
infinite_loop = "warn"
large_include_file = "warn"
min_ident_chars = "warn"
missing_assert_message = "warn"
missing_asserts_for_indexing = "warn"
missing_docs_in_private_items = "warn"
non_ascii_literal = "warn"
partial_pub_fields = "warn"
print_stderr = "warn"
print_stdout = "warn"
pub_without_shorthand = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
self_named_module_files = "warn"
semicolon_outside_block = "warn"
single_char_lifetime_names = "warn"
str_to_string = "warn"
string_add = "warn"
string_lit_chars_any = "warn"
string_slice = "warn"
suspicious_xor_used_as_pow = "warn"
todo = "warn"
try_err = "warn"
unimplemented = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
use_debug = "warn"
verbose_file_reads = "warn"
cfg_not_test = "warn"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
rust_2018_compatibility = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -1 }
deprecated_in_future = "warn"
ffi_unwind_calls = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_abi = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
non_ascii_idents = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
	"cfg(v1_77)",
	"cfg(nightly)",
	"cfg(web_time_test_coverage)",
] }

[workspace.lints.rustdoc]
all = { level = "warn", priority = -1 }

[lib]
bench = false
harness = false

[build-dependencies]
rustversion = { workspace = true, optional = true }

[target.'cfg(all(target_arch = "wasm32", any(target_os = "unknown", target_os = "none")))'.dependencies]
serde = { workspace = true, optional = true }
wasm-bindgen.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
rand = { workspace = true, features = ["std_rng", "sys_rng"] }
tests-web = { workspace = true, features = ["run"] }
wasm-bindgen-test.workspace = true

[features]
default = ["msrv", "std"]
msrv = ["dep:rustversion"]
serde = ["dep:serde"]
std = ["rand/std", "tests-web/std", "wasm-bindgen-test/std"]

[lints]
workspace = true

[profile.bench]
codegen-units = 1
lto = true

[profile.test]
opt-level = 1
