[package]
name = "tests-web"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
bench = false
doctest = false
harness = false
test = false

[[example]]
harness = false
name = "benchmark"
path = "../benches/benchmark.rs"
required-features = ["run"]
test = false

[[test]]
name = "atomic_failure"
path = "../tests/atomic_failure.rs"
required-features = ["run", "std"]

[[test]]
name = "atomic_success"
path = "../tests/atomic_success.rs"
required-features = ["run", "std"]

[[test]]
harness = false
name = "web_instant_failure_1"
path = "../tests/instant_failure_1.rs"
required-features = ["run", "std"]

[[test]]
harness = false
name = "web_instant_failure_2"
path = "../tests/instant_failure_2.rs"
required-features = ["run", "std"]

[[test]]
harness = false
name = "web_instant_success"
path = "../tests/instant_success.rs"
required-features = ["run"]

[[test]]
harness = false
name = "web_serde"
path = "../tests/serde.rs"
required-features = ["run", "serde"]

[[test]]
harness = false
name = "web_system_time_failure_1"
path = "../tests/system_time_failure_1.rs"
required-features = ["run", "std"]

[[test]]
harness = false
name = "web_system_time_failure_2"
path = "../tests/system_time_failure_2.rs"
required-features = ["run", "std"]

[[test]]
harness = false
name = "web_system_time_success"
path = "../tests/system_time_success.rs"
required-features = ["run"]

[[test]]
harness = false
name = "web_traits"
path = "../tests/traits.rs"
required-features = ["run"]

[[test]]
name = "web"
path = "../tests/web.rs"
required-features = ["run", "std"]

[target.'cfg(all(target_arch = "wasm32", target_feature = "atomics"))'.dev-dependencies]
futures-channel = { workspace = true, features = ["alloc"] }
futures-util.workspace = true
web-sys = { workspace = true, features = ["OfflineAudioContext", "console"] }
web-thread.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc.workspace = true
serde_json = { workspace = true, features = ["alloc"], optional = true }
serde-json-core = { workspace = true, optional = true }
serde_test = { workspace = true, optional = true }
wasm-bindgen-test.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
js-sys.workspace = true
libm.workspace = true
rand = { workspace = true, features = ["std_rng", "sys_rng"] }
static_assertions.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
  "CssStyleDeclaration",
  "Document",
  "Element",
  "HtmlTableElement",
  "HtmlTableRowElement",
  "Performance",
  "Window"
] }
web-time = { path = "../", default-features = false }

[features]
default = ["std"]
run = []
serde = ["dep:serde_json", "dep:serde-json-core", "dep:serde_test", "web-time/serde"]
std = [
  "futures-channel/std",
  "futures-util/std",
  "js-sys/std",
  "rand/std",
  "wasm-bindgen-futures/std",
  "wasm-bindgen-test/std",
  "wasm-bindgen/std",
  "web-sys/std",
  "web-time/std",
]

[lints]
workspace = true
