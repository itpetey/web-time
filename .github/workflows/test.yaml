name: Test

on:
  push:
    branches: ["main", "modernise"]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name:
      Test ${{ matrix.driver.description }} ${{ matrix.environment.description }} ${{
      matrix.rust.description }} ${{ matrix.features.description }}

    runs-on: ${{ matrix.driver.os }}

    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          # Native stable (1 combination)
          - driver: { os: ubuntu-latest, description: Native, native: true }
            environment: {}
            rust: { version: stable }
            features: { features: "", no_std: false }
            target: { target: x86_64-unknown-linux-gnu }

          # Node.js × {default, no_std, no_std+msrv} (3 combinations)
          - driver: { os: ubuntu-24.04, description: Node.js, nodejs: true }
            environment: { nodejs: true, no-modules: true }
            rust: { version: nightly, components: rust-src, build-std: true }
            features: { features: "", no_std: false }
            target: { target: wasm32-unknown-unknown }

          - driver: { os: ubuntu-24.04, description: Node.js, nodejs: true }
            environment: { nodejs: true, no-modules: true }
            rust: { version: nightly, components: rust-src, build-std: true }
            features: { features: --no-default-features, no_std: true, description: "(`no_std`)" }
            target: { target: wasm32-unknown-unknown }

          - driver: { os: ubuntu-24.04, description: Node.js, nodejs: true }
            environment: { nodejs: true, no-modules: true }
            rust: { version: nightly, components: rust-src, build-std: true }
            features:
              {
                features: --no-default-features --features msrv,
                no_std: true,
                description: "(`no_std`, `msrv`)",
              }
            target: { target: wasm32-unknown-unknown }

          # Chrome Browser × {default, no_std, no_std+msrv} (3 combinations)
          - driver:
              {
                os: ubuntu-latest,
                description: Chrome,
                env: CHROMEDRIVER,
                binary: chromedriver,
                browser: true,
              }
            environment: { name: WASM_BINDGEN_USE_BROWSER, browser: true }
            rust: { version: nightly, components: rust-src, build-std: true }
            features: { features: "", no_std: false }
            target: { target: wasm32-unknown-unknown }

          - driver:
              {
                os: ubuntu-latest,
                description: Chrome,
                env: CHROMEDRIVER,
                binary: chromedriver,
                browser: true,
              }
            environment: { name: WASM_BINDGEN_USE_BROWSER, browser: true }
            rust: { version: nightly, components: rust-src, build-std: true }
            features: { features: --no-default-features, no_std: true, description: "(`no_std`)" }
            target: { target: wasm32-unknown-unknown }

          - driver:
              {
                os: ubuntu-latest,
                description: Chrome,
                env: CHROMEDRIVER,
                binary: chromedriver,
                browser: true,
              }
            environment: { name: WASM_BINDGEN_USE_BROWSER, browser: true }
            rust: { version: nightly, components: rust-src, build-std: true }
            features:
              {
                features: --no-default-features --features msrv,
                no_std: true,
                description: "(`no_std`, `msrv`)",
              }
            target: { target: wasm32-unknown-unknown }

          # Chrome Dedicated Worker × {default, no_std, no_std+msrv} (3 combinations)
          - driver:
              {
                os: ubuntu-latest,
                description: Chrome,
                env: CHROMEDRIVER,
                binary: chromedriver,
                browser: true,
              }
            environment:
              {
                description: Dedicated Worker,
                name: WASM_BINDGEN_USE_DEDICATED_WORKER,
                browser: true,
              }
            rust: { version: nightly, components: rust-src, build-std: true }
            features: { features: "", no_std: false }
            target: { target: wasm32-unknown-unknown }

          - driver:
              {
                os: ubuntu-latest,
                description: Chrome,
                env: CHROMEDRIVER,
                binary: chromedriver,
                browser: true,
              }
            environment:
              {
                description: Dedicated Worker,
                name: WASM_BINDGEN_USE_DEDICATED_WORKER,
                browser: true,
              }
            rust: { version: nightly, components: rust-src, build-std: true }
            features: { features: --no-default-features, no_std: true, description: "(`no_std`)" }
            target: { target: wasm32-unknown-unknown }

          - driver:
              {
                os: ubuntu-latest,
                description: Chrome,
                env: CHROMEDRIVER,
                binary: chromedriver,
                browser: true,
              }
            environment:
              {
                description: Dedicated Worker,
                name: WASM_BINDGEN_USE_DEDICATED_WORKER,
                browser: true,
              }
            rust: { version: nightly, components: rust-src, build-std: true }
            features:
              {
                features: --no-default-features --features msrv,
                no_std: true,
                description: "(`no_std`, `msrv`)",
              }
            target: { target: wasm32-unknown-unknown }

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install `wasm-bindgen-cli`
        uses: ./.github/actions/setup-tool
        with:
          tool: wasm-bindgen-cli
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.rust.version }}
          target: ${{ matrix.target.target }}
          components: ${{ matrix.rust.components || '' }}
      - name: Setup Wasm build environment
        if: matrix.rust.build-std == true
        uses: ./.github/actions/setup-wasm
        with:
          cflags: ${{ matrix.rust.cflags || '' }}
          rustflags: ${{ matrix.rust.flags || '' }}
          build-std: "true"
          no-std: ${{ matrix.features.no_std || 'false' }}
      - name: Start and set WebDriver
        if: matrix.driver.browser == true
        run: |
          iteration=5

          while true; do
            if (( iteration == 0 )); then
              echo "CI: Failed to start driver."
              exit 1
            fi

            (( iteration-- ))

            ${{ matrix.driver.binary }} --port=9000 2>stderr &
            process_pid=$!
            tail -f stderr >&2 &

            if [[ $(wc -l < stderr) -gt 0 ]]; then
              echo "CI: WebDriver failed"
              kill -SIGKILL $process_pid || true
              echo

              echo "CI: stderr:"
              sed 's/^/CI:    /' stderr
              echo

              echo "CI: Re-trying to start the WebDriver."
            else
              echo "Successfully started WebDriver on port 9000."
              echo "${{ matrix.driver.env }}_REMOTE=http://127.0.0.1:9000" >> $GITHUB_ENV
              break
            fi
          done
      - name: Set environment
        if: matrix.environment.name != ''
        run: echo "${{ matrix.environment.name }}=1" >> $GITHUB_ENV
      - name: Test
        env:
          CFLAGS_wasm32_unknown_unknown: ${{ matrix.rust.cflags }}
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: ${{ matrix.rust.flags }}
          RUSTDOCFLAGS: ${{ matrix.rust.flags }}
        run: |
          SERDE_FEATURES="--features serde"
          if [ "${{ matrix.features.no_std }}" = "true" ]; then
            SERDE_FEATURES=""
          fi
          cargo test $SERDE_FEATURES ${{ matrix.features.features }} --target ${{ matrix.target.target }} $BUILD_STD_COMPONENTS --workspace ${{ matrix.target.docargs }}

  test-extra:
    name:
      Test Extra ${{ matrix.driver.description }} ${{ matrix.environment.description }} ${{
      matrix.rust.description }} ${{ matrix.features.description }}

    # Only run the full matrix on pushes to main, not on PRs.
    if: github.event_name == 'push' || github.event_name == 'merge_group'

    runs-on: ${{ matrix.driver.os }}

    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        target:
          - { target: wasm32-unknown-unknown }
        rust:
          - { version: nightly, components: rust-src, build-std: true }
          - {
              version: nightly,
              description: with Atomics,
              components: rust-src,
              cflags: -matomics -mbulk-memory,
              flags: "-Ctarget-feature=+atomics,+bulk-memory",
              build-std: true,
              atomics: true,
            }
        features:
          - { features: "", no_std: false }
          - { features: --no-default-features, no_std: true, description: (`no_std`) }
          - {
              features: --no-default-features --features msrv,
              no_std: true,
              description: "(`no_std`, `msrv`)",
            }
        driver:
          - {
              os: ubuntu-latest,
              description: Chrome,
              env: CHROMEDRIVER,
              binary: chromedriver,
              browser: true,
            }
          - {
              os: ubuntu-latest,
              description: Firefox,
              env: GECKODRIVER,
              binary: geckodriver,
              browser: true,
              firefox: true,
            }
          - {
              os: macos-latest,
              description: Safari,
              env: SAFARIDRIVER,
              binary: safaridriver,
              browser: true,
              macos: true,
            }
          - { os: ubuntu-24.04, description: Node.js, nodejs: true }
        environment:
          - { name: WASM_BINDGEN_USE_BROWSER, browser: true }
          - {
              description: Dedicated Worker,
              name: WASM_BINDGEN_USE_DEDICATED_WORKER,
              browser: true,
            }
          - {
              description: Shared Worker,
              name: WASM_BINDGEN_USE_SHARED_WORKER,
              browser: true,
              shared-worker: true,
            }
          - {
              description: Service Worker,
              name: WASM_BINDGEN_USE_SERVICE_WORKER,
              browser: true,
              service-worker: true,
            }
          - { nodejs: true, no-modules: true }
          - { description: ESM, name: WASM_BINDGEN_USE_NODE_EXPERIMENTAL, nodejs: true }
        include:
          - target: { target: x86_64-unknown-linux-gnu }
            rust: { version: stable }
            features: { features: "", no_std: false }
            driver: { os: ubuntu-latest, description: Native, native: true }
        exclude:
          - driver: { browser: true }
            environment: { browser: false }
          - driver: { nodejs: true }
            environment: { browser: true }
          # Firefox doesn't support `Atomics.waitAsync()` and the polyfill requires spawning workers.
          - driver: { firefox: true }
            rust: { atomics: true }
            environment: { shared-worker: true }
          # Firefox doesn't support module service workers.
          - driver: { firefox: true }
            environment: { service-worker: true }
          # Thread spawning is only supported for ESM
          - rust: { atomics: true }
            environment: { no-modules: true }

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install `wasm-bindgen-cli`
        uses: ./.github/actions/setup-tool
        with:
          tool: wasm-bindgen-cli
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.rust.version }}
          target: ${{ matrix.target.target }}
          components: ${{ matrix.rust.components || '' }}
      - name: Install Clang with `wasm32-unknown-unknown` support on MacOS
        if: matrix.driver.macos == true
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
      - name: Setup Wasm build environment
        if: matrix.rust.build-std == true
        uses: ./.github/actions/setup-wasm
        with:
          cflags: ${{ matrix.rust.cflags || '' }}
          rustflags: ${{ matrix.rust.flags || '' }}
          build-std: "true"
          no-std: ${{ matrix.features.no_std || 'false' }}
      - name: Start and set WebDriver
        if: matrix.driver.browser == true
        run: |
          iteration=5

          while true; do
            if (( iteration == 0 )); then
              echo "CI: Failed to start driver."
              exit 1
            fi

            (( iteration-- ))

            ${{ matrix.driver.binary }} --port=9000 2>stderr &
            process_pid=$!
            tail -f stderr >&2 &

            if [[ $(wc -l < stderr) -gt 0 ]]; then
              echo "CI: WebDriver failed"
              kill -SIGKILL $process_pid || true
              echo

              echo "CI: stderr:"
              sed 's/^/CI:    /' stderr
              echo

              echo "CI: Re-trying to start the WebDriver."
            else
              echo "Successfully started WebDriver on port 9000."
              echo "${{ matrix.driver.env }}_REMOTE=http://127.0.0.1:9000" >> $GITHUB_ENV
              break
            fi
          done
      - name: Set environment
        if: matrix.environment.name != ''
        run: echo "${{ matrix.environment.name }}=1" >> $GITHUB_ENV
      - name: Test
        env:
          CFLAGS_wasm32_unknown_unknown: ${{ matrix.rust.cflags }}
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS: ${{ matrix.rust.flags }}
          RUSTDOCFLAGS: ${{ matrix.rust.flags }}
        run: |
          SERDE_FEATURES="--features serde"
          if [ "${{ matrix.features.no_std }}" = "true" ]; then
            SERDE_FEATURES=""
          fi
          cargo test $SERDE_FEATURES ${{ matrix.features.features }} --target ${{ matrix.target.target }} $BUILD_STD_COMPONENTS --workspace ${{ matrix.target.docargs }}
