name: Coverage & Documentation

on:
  push:
    branches: ["main", "modernise"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Test Coverage ${{ matrix.mt.description }} ${{ matrix.features.description }}

    runs-on: ubuntu-latest

    timeout-minutes: 10

    strategy:
      matrix:
        mt:
          - { id: "st" }
          - {
              id: "mt",
              description: with Atomics,
              cflags: -matomics -mbulk-memory,
              flags: "-Ctarget-feature=+atomics,+bulk-memory",
            }
        features:
          - { id: "", features: "", no_std: false }
          - { id: -no_std, features: --no-default-features, no_std: true, description: (`no_std`) }

    env:
      CFLAGS_wasm32_unknown_unknown: ${{ matrix.mt.cflags }}
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUSTFLAGS:
        -Cinstrument-coverage -Zcoverage-options=condition --emit=llvm-ir
        --cfg=web_time_test_coverage ${{ matrix.mt.flags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install `wasm-bindgen-cli`
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli
      - name: Install Clang v19
        run: |
          sudo apt update
          sudo apt install -y curl
          curl --proto '=https' --tlsv1.2 -sSf https://apt.llvm.org/llvm.sh | sudo bash -s -- 23
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          target: wasm32-unknown-unknown
          components: rust-src
      - name: Set build-std components
        run: echo "BUILD_STD_COMPONENTS=-Zbuild-std=profiler_builtins" >> $GITHUB_ENV
      - name: Set serde features
        if: matrix.features.no_std == false
        run: echo "SERDE_FEATURES=--features serde" >> $GITHUB_ENV
      - name: Unset serde features
        if: matrix.features.no_std == true
        run: echo "SERDE_FEATURES=" >> $GITHUB_ENV
      - name: Get LLVM version
        id: llvm-version
        run: >
          echo "version=$(rustc --version --verbose | sed -n 's/LLVM version: //p')" >>
          "$GITHUB_OUTPUT"
      - name: Cache compiler-rt source
        uses: actions/cache@v4
        id: cache-compiler-rt
        with:
          path: /tmp/compiler-rt
          key: compiler-rt-${{ runner.os }}-${{ steps.llvm-version.outputs.version }}
      - name: Fetch compiler-rt source for profiler_builtins
        if: steps.cache-compiler-rt.outputs.cache-hit != 'true'
        run: |
          # profiler_builtins/build.rs needs the LLVM compiler-rt source to build
          # the profiler runtime for wasm targets. The rust-src component no longer
          # ships the LLVM source, so we fetch it here and point
          # RUST_COMPILER_RT_FOR_PROFILER at it.
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/llvm/llvm-project.git /tmp/llvm-project
          cd /tmp/llvm-project
          git sparse-checkout init --cone
          git sparse-checkout set compiler-rt
          git checkout HEAD
          mv compiler-rt /tmp/compiler-rt
      - name: Set RUST_COMPILER_RT_FOR_PROFILER
        run: echo "RUST_COMPILER_RT_FOR_PROFILER=/tmp/compiler-rt" >> "$GITHUB_ENV"
      - name: Install wasm32 C headers for profiler_builtins
        run: |
          # profiler_builtins compiles C source from compiler-rt for wasm32, but
          # wasm32-unknown-unknown has no libc headers (errno.h, etc.). Use the
          # wasi-libc headers to provide the POSIX definitions needed to build
          # the profiling runtime for WebAssembly targets.
          #
          # Note: The wasi-libc repository's "sysroot" directory is a build
          # artifact (generated by CMake/Make), not part of the source. Instead,
          # we assemble a synthetic include directory from the actual header
          # source directories, replicating what wasi-libc's build does.
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/WebAssembly/wasi-libc.git /tmp/wasi-libc
          cd /tmp/wasi-libc
          git sparse-checkout init --cone
          git sparse-checkout set \
            libc-bottom-half/headers/public \
            libc-top-half/musl/include \
            libc-top-half/musl/arch/wasm32/bits \
            libc-top-half/musl/arch/generic/bits \
            libc-top-half/musl/tools
          git checkout HEAD
          mkdir -p wasi-sysroot/include/bits
          # WASI-specific headers (__errno.h, __errno_values.h, etc.)
          cp -r libc-bottom-half/headers/public/* wasi-sysroot/include/
          # musl top-half public headers (errno.h, features.h, stdlib.h, etc.)
          cp -r libc-top-half/musl/include/* wasi-sysroot/include/
          # wasm32 arch-specific bits headers
          cp -r libc-top-half/musl/arch/wasm32/bits/* wasi-sysroot/include/bits/
          # generic bits headers (fallback definitions)
          cp -r libc-top-half/musl/arch/generic/bits/* wasi-sysroot/include/bits/
          # Generate bits/alltypes.h (required by many musl headers)
          sed -f libc-top-half/musl/tools/mkalltypes.sed \
            libc-top-half/musl/arch/wasm32/bits/alltypes.h.in \
            libc-top-half/musl/include/alltypes.h.in \
            > wasi-sysroot/include/bits/alltypes.h
          # Point to the synthetic sysroot
          echo "CFLAGS_wasm32_unknown_unknown=${{ matrix.mt.cflags }} -I$(pwd)/wasi-sysroot/include" >> "$GITHUB_ENV"
      - name: Test
        env:
          WASM_BINDGEN_USE_BROWSER: 1
          CHROMEDRIVER_REMOTE: http://127.0.0.1:9000
        run: |
          chromedriver --port=9000 &
          mkdir coverage-output
          LLVM_PROFILE_FILE=$(realpath coverage-output)/%m_%p.profraw cargo test --workspace $SERDE_FEATURES --target wasm32-unknown-unknown $BUILD_STD_COMPONENTS ${{ matrix.features.features }} --tests
      - name: Prepare Object Files
        run: |
          mkdir coverage-input
          crate_name=web_time
          IFS=$'\n'
          for file in $(
            cargo test --workspace $SERDE_FEATURES --target wasm32-unknown-unknown $BUILD_STD_COMPONENTS ${{ matrix.features.features }} --tests --no-run --message-format=json | \
            jq -r "select(.reason == \"compiler-artifact\") | (select(.target.kind == [\"test\"]) // select(.target.name == \"$crate_name\")) | .filenames[0]"
          )
          do
            if [[ ${file##*.} == "rlib" ]]; then
                base=$(basename $file .rlib)
                file=$(dirname $file)/${base#"lib"}.ll
            else
                file=$(dirname $file)/$(basename $file .wasm).ll
            fi

            clang-23 $file -Wno-override-module -c -o coverage-output/$(basename $file .ll).o
          done
      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-${{ matrix.mt.id }}${{ matrix.features.id }}
          path: coverage-output
          retention-days: 1
          if-no-files-found: error

  collect-coverage:
    name: Collect Test Coverage

    needs: coverage

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: llvm-tools
      - name: Install `cargo-binutils`
        uses: ./.github/actions/setup-tool
        with:
          tool: cargo-binutils
      - name: Download Test Coverage
        uses: actions/download-artifact@v4
        with:
          pattern: test-coverage-*
          path: coverage-input
      - name: Merge Profile Data
        run:
          rust-profdata merge -sparse coverage-input/*/*.profraw -o coverage-input/coverage.profdata
      - name: Export Code Coverage Report
        run: |
          mkdir coverage-output
          objects=()
          for file in $(ls coverage-input/*/*.o)
          do
              objects+=(-object $file)
          done
          rust-cov show -show-instantiations=false -output-dir coverage-output -format=html -instr-profile=coverage-input/coverage.profdata ${objects[@]} -sources src
          rust-cov export -format=text -summary-only -instr-profile=coverage-input/coverage.profdata ${objects[@]} -sources src | \
          printf '{ "coverage": "%.2f%%" }' $(jq '.data[0].totals.functions.percent') > coverage-output/coverage.json
          sed 's/<!doctype html>//' coverage-output/index.html | sed "s/<script src='control.js'><\/script>//" | perl -p0e 's/<a[^>]*>((?!here).*?)<\/a>/$1/g' >> $GITHUB_STEP_SUMMARY
      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: coverage-output
          if-no-files-found: error

  document:
    name: Document

    runs-on: ubuntu-latest

    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          target: wasm32-unknown-unknown
      - name: Run Rustdoc
        env:
          RUSTDOCFLAGS: --crate-version main --cfg=docsrs
        run:
          cargo doc --no-deps -Z rustdoc-map -Z rustdoc-scrape-examples --target
          wasm32-unknown-unknown --features serde
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Fix permissions
        run: |
          chmod -c -R +rX "target/wasm32-unknown-unknown/doc" | while read line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: target/wasm32-unknown-unknown/doc
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy

    needs: [collect-coverage, document]

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}doc/web_time

    runs-on: ubuntu-latest

    if:
      github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_name ==
      'main')

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download Test Coverage
        uses: actions/download-artifact@v4
        with:
          name: test-coverage
          path: page/coverage
      - name: Download Documentation
        uses: actions/download-artifact@v4
        with:
          name: documentation
          path: page/doc
      - name: Upload Page Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: page
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
