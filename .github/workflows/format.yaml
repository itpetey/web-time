name: Format

on:
  push:
    branches: ["main", "modernise"]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  rustfmt:
    name: Rustfmt

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: rustfmt
      - name: Run Rustfmt
        run: cargo fmt --check

  tombi:
    name: Tombi

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Tombi
        uses: ./.github/actions/setup-tool
        with:
          tool: tombi
      - name: Run Tombi
        run: tombi format --check

  prettier:
    name: Prettier

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Prettier
        run: sudo npm i -g prettier
      - name: Run Prettier
        run: prettier . --check
